<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e1d">
<meta name="description" content="Halaman akses pengembang.">
<meta name="robots" content="noindex,nofollow">
<title>Akses — GeoFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2322d3ee'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' font-family='Arial' font-weight='700' fill='%23041018'%3EG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/landing.css">
<link rel="stylesheet" href="./css/pages.css">
</head>
<body>
<main class="auth-wrap">
 <div class="auth-card">
  <div class="lock" aria-hidden="true">🔐</div>
  <h1>Akses pengembang</h1>
  <p class="muted" style="margin:0 0 6px;font-size:14px">Masuk untuk melihat riwayat kunjungan media GeoFlow.</p>
  <form id="loginForm" autocomplete="off" novalidate>
   <label class="field" for="u">Nama pengguna</label><input id="u" class="input" type="text" autocomplete="username" required>
   <label class="field" for="p">Kata sandi</label><input id="p" class="input" type="password" autocomplete="current-password" required>
   <label class="check"><input id="showPw" type="checkbox"> Tampilkan kata sandi</label>
   <div id="err" class="err" role="alert" hidden></div>
   <button id="loginBtn" class="btn primary" type="submit">Masuk</button>
  </form>
  <a class="back" href="./index.html">← Kembali ke beranda</a>
 </div>
</main>
<script src="./js/config.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/common.js"></script>
<script src="./js/akses.js"></script>
</body>
</html>
